<svg width="750" height="422" viewBox="0 0 750 422" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0714"/>
      <stop offset="55%" stop-color="#180f38"/>
      <stop offset="100%" stop-color="#2c1760"/>
    </linearGradient>
    <radialGradient id="glow2" cx="75%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#b568ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b568ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#e2b8ff"/>
      <stop offset="45%" stop-color="#8a4fe0"/>
      <stop offset="100%" stop-color="#2a1250"/>
    </linearGradient>
    <radialGradient id="spec2" cx="35%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b568ff"/>
      <stop offset="100%" stop-color="#38e8ff"/>
    </linearGradient>
    <filter id="shadow2" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#08010f" flood-opacity="0.55"/>
    </filter>
    <filter id="blurGlow2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="750" height="422" fill="url(#bg2)"/>
  <circle cx="580" cy="130" r="230" fill="url(#glow2)"/>

  <rect x="60" y="50" width="132" height="36" rx="18" fill="#180f38" fill-opacity="0.6" stroke="#b568ff" stroke-opacity="0.6"/>
  <circle cx="82" cy="68" r="5" fill="#b568ff"/>
  <text x="96" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6cfff">AI Agents</text>

  <!-- glossy central orb with connected satellite nodes (network of agents) -->
  <g transform="translate(500,60)">
    <circle cx="110" cy="110" r="115" fill="#b568ff" opacity="0.22" filter="url(#blurGlow2)"/>
    <line x1="80" y1="80" x2="180" y2="55" stroke="#e6cfff" stroke-width="2.5" opacity="0.7"/>
    <line x1="80" y1="80" x2="90" y2="175" stroke="#e6cfff" stroke-width="2.5" opacity="0.7"/>
    <line x1="180" y1="55" x2="200" y2="140" stroke="#e6cfff" stroke-width="2.5" opacity="0.7"/>
    <line x1="90" y1="175" x2="200" y2="140" stroke="#e6cfff" stroke-width="2.5" opacity="0.7"/>

    <circle cx="80" cy="80" r="34" fill="#170a2e" filter="url(#shadow2)"/>
    <circle cx="80" cy="80" r="34" fill="url(#orb2)"/>
    <ellipse cx="68" cy="68" rx="14" ry="9" fill="url(#spec2)"/>

    <circle cx="180" cy="55" r="22" fill="#170a2e" filter="url(#shadow2)"/>
    <circle cx="180" cy="55" r="22" fill="url(#orb2)"/>
    <ellipse cx="173" cy="48" rx="9" ry="6" fill="url(#spec2)"/>

    <circle cx="200" cy="140" r="26" fill="#170a2e" filter="url(#shadow2)"/>
    <circle cx="200" cy="140" r="26" fill="url(#orb2)"/>
    <ellipse cx="191" cy="131" rx="10" ry="7" fill="url(#spec2)"/>

    <circle cx="90" cy="175" r="18" fill="#170a2e" filter="url(#shadow2)"/>
    <circle cx="90" cy="175" r="18" fill="url(#orb2)"/>
    <ellipse cx="84" cy="169" rx="7" ry="5" fill="url(#spec2)"/>
  </g>

  <text x="60" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Intro to AI Agents</text>
  <text x="60" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#chip2)">and Agentic AI</text>
  <rect x="60" y="362" width="72" height="6" rx="3" fill="url(#chip2)"/>
  <text x="60" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#cbb0ec">Design autonomous, multi-step AI workflows</text>
</svg>
