  <g transform="translate(450,90)" filter="url(#shadow3)">
    <rect x="0" y="0" width="260" height="165" rx="14" fill="url(#glass3)" stroke="url(#chip3)" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="32" rx="14" fill="#101f3d"/>
