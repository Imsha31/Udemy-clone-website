<svg width="750" height="422" viewBox="0 0 750 422" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="55%" stop-color="#0b1c3f"/>
      <stop offset="100%" stop-color="#123467"/>
    </linearGradient>
    <radialGradient id="glow3" cx="75%" cy="30%" r="60%">
