    </linearGradient>
    <filter id="shadow3" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="750" height="422" fill="url(#bg3)"/>
  <circle cx="580" cy="120" r="230" fill="url(#glow3)"/>

