<svg width="750" height="422" viewBox="0 0 750 422" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#0f2a4d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="72%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38e8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb1" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#5fefff"/>
      <stop offset="45%" stop-color="#2f8fe0"/>
      <stop offset="100%" stop-color="#12224a"/>
    </linearGradient>
    <radialGradient id="spec1" cx="35%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38e8ff"/>
      <stop offset="100%" stop-color="#7c6bff"/>
    </linearGradient>
    <filter id="shadow1" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <filter id="blurGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="750" height="422" fill="url(#bg1)"/>
  <circle cx="580" cy="120" r="230" fill="url(#glow1)"/>
  <g fill="#ffffff" opacity="0.05">
    <circle cx="40" cy="40" r="1.6"/><circle cx="80" cy="40" r="1.6"/><circle cx="120" cy="40" r="1.6"/>
    <circle cx="40" cy="80" r="1.6"/><circle cx="80" cy="80" r="1.6"/><circle cx="120" cy="80" r="1.6"/>
  </g>

  <rect x="60" y="50" width="152" height="36" rx="18" fill="#0d1b2e" fill-opacity="0.6" stroke="#38e8ff" stroke-opacity="0.6"/>
  <circle cx="82" cy="68" r="5" fill="#38e8ff"/>
  <text x="96" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#aef1ff">AI Engineering</text>

  <!-- glossy 3D orb / chip -->
  <g transform="translate(500,60)">
    <circle cx="105" cy="105" r="110" fill="#38e8ff" opacity="0.25" filter="url(#blurGlow)"/>
    <circle cx="105" cy="115" r="95" fill="#03060c" filter="url(#shadow1)"/>
    <circle cx="105" cy="105" r="95" fill="url(#orb1)"/>
    <ellipse cx="70" cy="65" rx="45" ry="30" fill="url(#spec1)"/>
    <path d="M55 120 q15 -45 50 -45 q30 0 40 25 q18 -8 28 15 q8 18 -14 26" fill="none" stroke="#eafcff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="55" cy="120" r="5" fill="#eafcff"/>
    <circle cx="105" cy="75" r="5" fill="#eafcff"/>
    <circle cx="145" cy="100" r="5" fill="#7c6bff"/>
    <circle cx="163" cy="115" r="5" fill="#7c6bff"/>
  </g>

  <text x="60" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">AI Engineer Course</text>
  <text x="60" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#chip1)">2026</text>
  <rect x="60" y="374" width="72" height="6" rx="3" fill="url(#chip1)"/>
  <text x="60" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#a9c6e0">Build, deploy and scale real AI systems</text>
</svg>
